[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habit-tracker"
dynamic = ["version"]
description = "Track daily habits with a clean desktop UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2", "pystray>=0.19", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
habit-tracker = "habit_tracker.app:main"

[tool.setuptools.dynamic]
version = { attr = "habit_tracker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
habit_tracker = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
