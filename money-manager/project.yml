name: MoneyManager
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or pick it in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""

targets:
  MoneyManager:
    type: application
    platform: iOS
    sources:
      - path: MoneyManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moneymanager
        PRODUCT_NAME: MoneyManager
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Money
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan receipts and invoices to add transactions."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import receipt photos to add transactions."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  MoneyManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyManagerTests
    dependencies:
      - target: MoneyManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.moneymanager.tests

schemes:
  MoneyManager:
    build:
      targets:
        MoneyManager: all
        MoneyManagerTests: [test]
    test:
      targets:
        - MoneyManagerTests
