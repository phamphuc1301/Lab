name: money-manager-flutter

on:
  push:
    paths: ["money-manager-flutter/**", ".github/workflows/money-manager-flutter.yml"]
  pull_request:
    paths: ["money-manager-flutter/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: money-manager-flutter

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      # Unsigned build. Install it from Windows with Sideloadly, which signs it with your Apple ID.
      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MoneyManager-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyManager-flutter-unsigned-ipa
          path: money-manager-flutter/MoneyManager-unsigned.ipa
